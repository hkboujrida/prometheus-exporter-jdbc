# Publishes a tagged release with a self-contained linux-x64 single-file binary
# (for hosts without the .NET runtime, e.g. IBM i PASE) plus the Docker image.
name: Build new release
on:
  push:
    tags:
    - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Publish self-contained binary
      run: >
        dotnet publish src/PromExporter.Jdbc -c Release -r linux-x64
        --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        -o out
    - name: Archive
      run: |
        cd out
        zip -r ../prometheus-exporter-jdbc-linux-x64.zip .
    - name: Create the release
      uses: softprops/action-gh-release@v2
      with:
        files: prometheus-exporter-jdbc-linux-x64.zip

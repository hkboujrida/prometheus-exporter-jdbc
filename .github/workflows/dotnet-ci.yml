name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore PromExporter.slnx
    - name: Build
      run: dotnet build PromExporter.slnx -c Release --no-restore
    - name: Test
      run: dotnet test PromExporter.slnx -c Release --no-build

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'dotnet-metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['dotnet-exporter:9853']

  - job_name: 'dotnet-metrics-now'
    metrics_path: '/metrics_now'
    scrape_interval: 5s
    static_configs:
      - targets: ['dotnet-exporter:9853']

  - job_name: 'java-metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['java-exporter:9853']
